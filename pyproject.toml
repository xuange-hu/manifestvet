[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manifestvet"
version = "0.1.0"
description = "Read an Android manifest the way an attacker does — zero-dependency AXML parser, 40 rules for the exported surface, byte-level evidence, SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Zero runtime dependencies on purpose: this has to run inside the same slim
# container that builds the APK, and next to a model that cannot pip install.
dependencies = []
keywords = [
  "android",
  "androidmanifest",
  "apk",
  "axml",
  "mobile-security",
  "static-analysis",
  "exported-components",
  "content-provider",
  "deep-links",
  "sarif",
  "devsecops",
  "linter",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved the import path; this server
# targets the 1.x line only.
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/manifestvet"
Repository = "https://github.com/xuange-hu/manifestvet"
Issues = "https://github.com/xuange-hu/manifestvet/issues"

[project.scripts]
manifestvet = "manifestvet.cli:main"
manifestvet-mcp = "manifestvet.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manifestvet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
